name: Validate Zed No AI for Mac
on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject unreviewed changes to AI and telemetry safeguards
        run: script/audit-no-ai-source
      - name: Verify upstream and privacy guard regressions
        run: python3 -m unittest discover -s script/tests
  mac:
    needs: source-guards
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      ZED_RELEASE_CHANNEL: dev
      NO_AI_SIGNED_RELEASE: '0'
      ZED_UPDATE_EXPLANATION: Build updates from the Zed No AI fork.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        id: rust-cache
        timeout-minutes: 8
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: no-ai-debug-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            no-ai-debug-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - name: Build dependencies
        run: brew install cmake pkg-config
      - name: Audit production dependencies for AI and telemetry
        run: script/audit-no-ai
      - name: Verify telemetry cannot collect or send data
        run: cargo test --locked -p telemetry && cargo test --locked -p client --lib no_telemetry_fork
      - name: Check keymaps load without removed AI and collaboration actions
        run: cargo test --locked -p settings --lib no_ai_fork_keymap
      - name: Check extension startup avoids empty update requests
        run: cargo test --locked -p extension_host --lib no_ai_fork_empty_extension_update_check_never_sends
      - name: Check fork update selection
        run: cargo test --locked -p auto_update --lib no_ai_fork
      - name: Check notebook data preservation
        run: cargo test --locked -p notebook_safety
      - name: Check the production application
        run: cargo check --locked -p zed --bin zed && cargo check --locked -p remote_server --lib --bin remote_server
      - name: Verify AI cannot be re-enabled through settings
        run: cargo test --locked -p project --lib no_ai_fork_settings_cannot_enable_ai
      - name: Check notebook open and save regressions
        run: cargo test --locked -p repl --lib notebook::notebook_ui::tests::test_open_single_file_notebook && cargo test --locked -p repl --lib notebook::notebook_ui::tests::test_save_goes_through_the_project && cargo test --locked -p repl --lib no_ai_fork_notebook
      - name: Check Python kernel discovery
        run: cargo test --locked -p repl --lib kernels::native_kernel::test::test_get_kernelspecs
      - name: Save Rust cache (best effort)
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 8
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/debug
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
