name: Validate nain for Mac
on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject unreviewed changes to AI and telemetry safeguards
        run: script/audit-no-ai-source
      - name: Verify upstream and privacy guard regressions
        run: python3 -m unittest discover -s script/tests
  mac:
    needs: source-guards
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
      KACHE_GC_EVICT_SHARED: '1'
      KACHE_MAX_SIZE: 1536MiB
      ZED_RELEASE_CHANNEL: dev
      NO_AI_SIGNED_RELEASE: '0'
      ZED_UPDATE_EXPLANATION: Build updates from the nain fork.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore compiler and dependency caches
        id: rust-cache
        uses: ./.github/actions/rust-build-cache
        timeout-minutes: 8
        continue-on-error: true
        with:
          profile: debug
      - name: Build dependencies
        run: brew install cmake pkg-config
      - name: Audit production dependencies for AI and telemetry
        run: script/audit-no-ai
      - name: Compile native safeguard tests once and run every selected suite
        run: python3 script/test-no-ai-mac.py
      - name: Check the production application without test feature unification
        run: cargo check --locked -p zed --bin zed && cargo check --locked -p remote_server --lib --bin remote_server
      - name: Save bounded compiler caches (best effort)
        if: always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && inputs.checkout_ref == github.sha
        uses: ./.github/actions/save-rust-build-cache
        timeout-minutes: 8
        continue-on-error: true
        with:
          compiler-key: ${{ steps.rust-cache.outputs.compiler-key }}
          compiler-hit: ${{ steps.rust-cache.outputs.compiler-hit }}
          sources-key: ${{ steps.rust-cache.outputs.sources-key }}
          sources-hit: ${{ steps.rust-cache.outputs.sources-hit }}
      - name: Record compiler cache statistics
        if: always()
        continue-on-error: true
        run: |
          if command -v kache >/dev/null 2>&1; then
            mkdir -p target/runtime-reports
            kache stats --json > target/runtime-reports/kache.json
          fi
      - name: Upload validation timing and cache reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-${{ matrix.runner }}
          path: target/runtime-reports/
          if-no-files-found: warn
