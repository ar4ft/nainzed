name: Review upstream Zed stable updates
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
concurrency:
  group: no-ai-upstream-maintenance
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare a stable update PR without merging or publishing
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s script/tests -p test_upstream_maintenance.py
          python3 script/upstream-maintenance.py --apply
