name: Build Zed No AI for Mac
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact upstream-update commit to validate
        required: true
        type: string
  push:
    branches: [main]
concurrency:
  group: no-ai-mac-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/no-ai-validate.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref || github.sha }}
  package:
    # PRs get validation without waiting for release compilation and packaging.
    if: github.event_name != 'pull_request'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      CARGO_INCREMENTAL: '0'
      ZED_RELEASE_CHANNEL: dev
      NO_AI_SIGNED_RELEASE: '0'
      ZED_ALLOW_EMULATED_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - run: rustup show
      - uses: actions/cache/restore@v4
        id: rust-cache
        timeout-minutes: 8
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/release
          key: no-ai-release-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            no-ai-release-${{ matrix.runner }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
      - run: brew install cmake pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Create application and installers
        id: build
        run: script/build-no-ai-mac
      - name: Check fresh startup network attempts
        run: python3 script/privacy-no-ai-mac.py --app 'target/release/bundle/osx/Zed No AI.app' --output target/runtime-reports/privacy.json
      - name: Measure startup, memory, large files and notebooks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 script/benchmark-no-ai-mac.py --app 'target/release/bundle/osx/Zed No AI.app' --output target/runtime-reports/mac-benchmark.json
      - name: Measure notebook serialization and recovery
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo run --locked --release -p notebook_safety --example benchmark > target/runtime-reports/notebook-benchmark.json
      - name: Upload runtime reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-reports-${{ matrix.runner }}
          path: target/runtime-reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: Zed-No-AI-${{ matrix.runner }}
          path: target/no-ai-*/*
          if-no-files-found: error
      - name: Save Rust cache (best effort)
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        timeout-minutes: 8
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target/release
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
  publish-prerelease:
    needs: [validate, package]
    # Upstream review builds and PRs must not publish unmerged code.
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.checkout_ref == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: Zed-No-AI-*
          merge-multiple: true
          path: packages
      - name: Publish checked development installers as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 script/publish-no-ai-prerelease.py \
            --packages packages --repository "$RELEASE_REPOSITORY" \
            --commit "$RELEASE_COMMIT" --run-number "$RELEASE_RUN_NUMBER" \
            --run-url "$RELEASE_RUN_URL"
