name: Build Zed No AI for Mac
on:
  workflow_dispatch:
  pull_request:
    branches: [main, no-ai]
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact upstream-update commit to validate
        required: true
        type: string
  push:
    branches: [main, no-ai]
concurrency:
  group: no-ai-mac-${{ inputs.checkout_ref || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Reject unreviewed changes to AI and telemetry safeguards
        run: script/audit-no-ai-source
  mac:
    needs: source-guards
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    # A cold Intel build plus tests and thin LTO can exceed three hours.
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: '0'
      ZED_RELEASE_CHANNEL: dev
      NO_AI_SIGNED_RELEASE: '0'
      ZED_UPDATE_EXPLANATION: Build updates from the Zed No AI fork.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-ai-${{ matrix.runner }}
          cache-on-failure: true
      - name: Build dependencies
        run: brew install cmake pkg-config
      - name: Audit production dependencies for AI and telemetry
        run: script/audit-no-ai
      - name: Verify telemetry cannot collect or send data
        run: cargo test --locked -p telemetry && cargo test --locked -p client --lib no_telemetry_fork
      - name: Check fork update selection
        run: cargo test --locked -p auto_update --lib no_ai_fork
      - name: Check notebook data preservation
        run: cargo test --locked -p notebook_safety
      - name: Check the production application
        run: cargo check --locked -p zed --bin zed && cargo check --locked -p remote_server --lib --bin remote_server
      - name: Verify AI cannot be re-enabled through settings
        run: cargo test --locked -p project --lib no_ai_fork_settings_cannot_enable_ai
      - name: Check notebook open and save regressions
        run: cargo test --locked -p repl --lib notebook::notebook_ui::tests::test_open_single_file_notebook && cargo test --locked -p repl --lib notebook::notebook_ui::tests::test_save_goes_through_the_project && cargo test --locked -p repl --lib no_ai_fork_notebook
      - name: Check Python kernel discovery
        run: cargo test --locked -p repl --lib kernels::native_kernel::test::test_get_kernelspecs
      - name: Create application and installers
        run: script/build-no-ai-mac
      - uses: actions/upload-artifact@v4
        with:
          name: Zed-No-AI-${{ matrix.runner }}
          path: target/no-ai-*/*
          if-no-files-found: error
