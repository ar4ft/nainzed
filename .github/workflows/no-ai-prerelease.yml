name: Publish completed development build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main run ID from Build nain for Mac
        required: true
        type: string
concurrency:
  group: no-ai-prerelease-${{ inputs.run_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check publishing safeguards
        run: |
          script/audit-no-ai-source
          python3 -m unittest discover -s script/tests -p test_prerelease_publishing.py
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: '{nain-*,Zed-No-AI-*}'
          merge-multiple: true
          path: packages
      - name: Verify completed checks and publish their installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 script/publish-no-ai-prerelease.py \
            --packages packages --repository "$RELEASE_REPOSITORY" \
            --completed-run "$RELEASE_RUN_ID"
